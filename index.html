async function guardarPrecios(){const planes={};
 for(const p of PLANES){const reg=+$(`pr-${p.k}-reg`).value,of=+$(`pr-${p.k}-of`).value;
  if(!(reg>0&&of>0&&of<reg))return toast(`En "${p.n}", el precio de oferta tiene que ser menor al regular.`,1);const lr=$(`pr-${p.k}-lr`).value.trim(),lo=$(`pr-${p.k}-lo`).value.trim();
  if((lr&&!lr.startsWith('https://'))||(lo&&!lo.startsWith('https://')))return toast('Los links de pago tienen que empezar con https://',1);
  planes[p.k]={reg,of,linkReg:lr,linkOf:lo}}
 const activa=$('of-on').checked,desde=$('of-desde').value,hasta=$('of-hasta').value;
 if(activa&&(!desde||!hasta||ar(hasta)<=ar(desde)))return toast('Completá el comienzo y el fin de la oferta (el fin tiene que ser posterior).',1);
 try{await setDoc(doc(db,'config','precios'),{planes,oferta:{activa,desde,hasta},updatedAt:serverTimestamp()});await loadCfg();toast('Precios y oferta guardados.');go('precios')}catch(e){toast('Error: '+e.message,1)}}

function aplicarPref(){document.documentElement.style.fontSize=TAMS[tam]+'px';document.documentElement.classList.toggle('dark',oscuro);$('btn-tema').innerHTML=`<i class="fa-solid ${oscuro?'fa-sun text-amber-400':'fa-moon text-gray-600'}"></i>`}
function cambiarTam(d){tam=Math.min(TAMS.length-1,Math.max(0,tam+d));LS.set('tam',tam);aplicarPref()}

function comprimir(file,max=900,q=.72){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',q))};im.onerror=()=>no(new Error('No se pudo leer la imagen ('+file.name+').'));im.src=u})}
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});

/* ===== ESTUDIOS MÉDICOS (PDF guardados en Firestore, sin Storage) ===== */
const MAX_PDF=3*1024*1024,CH=900000;
const listEst=async uid=>(await Promise.all([1,2,3,4,5].map(i=>getDoc(doc(db,'estudios',uid+'_'+i)).catch(()=>null)))).filter(d=>d&&d.exists()).map(d=>({id:d.id,...d.data()}));
const estHTML=(es,del)=>es.length?es.map(e=>`<div class="flex justify-between items-center gap-2 p-3 bg-sand rounded-xl text-xs"><span class="truncate"><i class="fa-solid fa-file-pdf text-red-500"></i> ${esc(e.nombre)} <span class="text-gray-400">(${Math.round(e.size/1024)} KB)</span></span><span class="flex gap-2 shrink-0"><button type="button" class="chip bg-brand-700 text-white" onclick="verEstudio('${e.id}')">Ver</button>${del?`<button type="button" class="chip bg-red-600 text-white" onclick="borrarEstudio('${e.id}','${e.userId}')">Eliminar</button>`:''}</span></div>`).join(''):'<p class="text-xs text-gray-500">Sin estudios cargados.</p>';
const estCard=(es,uid)=>`<div class="card space-y-3"><div class="flex justify-between items-center"><h3 class="text-lg font-extrabold">Cargar estudios médicos</h3><span class="chip bg-brand-100 text-brand-800">${es.length}/5</span></div><p class="text-xs text-gray-600">Subí tus análisis o estudios en PDF (hasta 5, de 3 MB cada uno). Tu nutricionista puede verlos.</p><div class="space-y-2">${estHTML(es,true)}</div>${es.length<5?`<input id="est-file" type="file" accept="application/pdf" multiple class="text-xs"><button class="btn" onclick="subirEstudios('${uid}')"><i class="fa-solid fa-upload"></i> Cargar</button>`:'<p class="text-xs text-amber-700 font-bold">Llegaste al máximo de 5 estudios. Eliminá uno para cargar otro.</p>'}</div>`;
async function subirEstudios(uid){const fs=[...($('est-file')?.files||[])];if(!fs.length)return toast('Elegí al menos un PDF.',1);
 try{toast('Cargando, esperá unos segundos...');const ex=(await listEst(uid)).map(e=>e.id);let n=0;
  for(const f of fs){
   if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){toast(f.name+': solo se aceptan PDF.',1);continue}
   if(f.size>MAX_PDF){toast(f.name+': supera los 3 MB.',1);continue}
   const slot=[1,2,3,4,5].map(i=>uid+'_'+i).find(id=>!ex.includes(id));
   if(!slot){toast('Ya tenés el máximo de 5 estudios.',1);break}
   const d=await b64(f),parts=Math.ceil(d.length/CH);
   await setDoc(doc(db,'estudios',slot),{userId:uid,nombre:f.name.slice(0,80),size:f.size,partes:parts,createdAt:serverTimestamp()});
   for(let i=0;i<parts;i++)await setDoc(doc(db,'estudios',slot,'partes',String(i)),{d:d.slice(i*CH,(i+1)*CH)});
   ex.push(slot);n++}
  if(n)toast(n+' estudio(s) cargado(s).');go('ficha')
 }catch(e){toast('No se pudo cargar: '+e.message,1)}}
async function verEstudio(id){const w=window.open('','_blank');
 try{const ps=(await getDocs(collection(db,'estudios',id,'partes'))).docs.sort((a,b)=>a.id-b.id).map(d=>d.data().d).join('');
  const bin=atob(ps),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));w?w.location=url:location.href=url
 }catch(e){if(w)w.close();toast('No se pudo abrir: '+e.message,1)}}
async function borrarEstudio(id,uid){if(!confirm('¿Eliminar este estudio?'))return;
 try{for(const p of (await getDocs(collection(db,'estudios',id,'partes'))).docs)await deleteDoc(p.ref);await deleteDoc(doc(db,'estudios',id));S.tab==='ficha'?go('ficha'):abrirFicha(uid)}catch(e){toast('Error: '+e.message,1)}}

ento de las normas sobre protección de datos personales.</p><p><b>8. Conservación y seguridad.</b> Conservamos tus datos mientras mantengas tu cuenta o sean necesarios para tu atención, y aplicamos medidas técnicas de seguridad. Podés pedir la baja de tu cuenta.</p><p><b>9. Cambios.</b> Si modificamos esta política te lo vamos a informar.</p></div>`};
const verPolitica=()=>modal(`<h3 class="text-xl font-extrabold mb-3">Política de Privacidad</h3>${POLITICA()}`);
const CONSENT=()=>`<div class="card max-w-2xl mx-auto space-y-4"><h2 class="text-xl font-extrabold">Antes de continuar</h2><p class="text-xs text-gray-600">Para usar la plataforma necesitamos tu consentimiento para tratar tus datos personales y de salud.</p><div class="max-h-64 overflow-y-auto p-4 bg-sand rounded-2xl">${POLITICA()}</div><label class="flex items-start gap-2 text-xs"><input id="c-ok" type="checkbox" class="mt-0.5"> <span>${CONSENT_TXT}</span></label><div class="flex gap-2"><button class="btn" onclick="aceptarConsent()">Aceptar y continuar</button><button class="btn2" onclick="askLogout()">Cerrar sesión</button></div></div>`;
async function aceptarConsent(){if(!$('c-ok').checked)return toast('Tenés que aceptar para continuar.',1);
 try{await setDoc(doc(db,'users',S.user.uid),{consent:{v:CONSENT_V,fecha:serverTimestamp()}},{merge:true});S.consent=true;render()}catch(e){toast('Error: '+e.message,1)}}

/* ===== COPIA DE SEGURIDAD (descarga manual, solo administradores) ===== */
async function descargarCopia(){try{toast('Preparando la copia...');const out={fecha:new Date().toISOString()};
 for(const c of ['users','fichas_medicas','planes_nutricionales','turnos','ventas','nutris','solicitudes','productos','resenas'])out[c]=(await all(c)).map(d=>{const x={...d};if(x.imgs)x.imgs=x.imgs.length+' imagen(es)';if(x.fotos)x.fotos=x.fotos.length+' foto(s)';return x});
 for(const c of ['precios','sitio']){const d=await getDoc(doc(db,'config',c));out['config_'+c]=d.exists()?d.data():null}
 const u=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='copia-nutricion-pam-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Copia descargada.')}catch(e){toast('Error: '+e.message,1)}}

/* ===== PLAN EN PDF (visor, comentario, descarga) ===== */
async function bytesDe(...ruta){const ps=(await getDocs(collection(db,...ruta))).docs.sort((a,b)=>a.id-b.id).map(d=>d.data().d).join(''),bin=atob(ps),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
const planHTML=(pd,uid)=>{S.planUid=uid;return `${pd.pdfPartes>0?`<div class="flex flex-wrap justify-between items-center gap-2"><span class="text-xs font-bold"><i class="fa-solid fa-file-pdf text-red-500"></i> ${esc(pd.pdfNombre)}</span><button class="btn" onclick="descargarPlan('${uid}')"><i class="fa-solid fa-download"></i> Descargar PDF</button></div><div id="visor" class="max-h-[75vh] overflow-y-auto rounded-2xl bg-sand p-2 text-xs text-gray-500">Cargando tu plan...</div>`:pd.plan?`<div class="p-6 bg-sand rounded-2xl text-sm leading-relaxed">${br(pd.plan)}</div>`:`<div class="p-8 text-center bg-sand rounded-3xl space-y-2"><div class="text-3xl">⏳</div><h3 class="font-extrabold">Esperá que tu nutricionista cargue tu plan</h3><p class="text-xs text-gray-600 max-w-md mx-auto">Tu plan alimentario personalizado se carga luego de tu consulta presencial u online.</p></div>`}${pd.comentario?`<div class="p-4 bg-brand-50 border border-brand-100 rounded-2xl"><h4 class="font-bold text-brand-800 text-xs uppercase mb-1">Comentario de tu nutricionista</h4><p class="text-sm whitespace-pre-line">${esc(pd.comentario)}</p></div>`:''}`};
async function cargarVisor(uid){const c=$('visor');if(!c||!uid)return;
 try{const u=await bytesDe('planes_nutricionales',uid,'partes');
  if(window.pdfjsLib){const pdf=await pdfjsLib.getDocument({data:u.slice()}).promise;c.innerHTML='';
   for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n),w=(c.clientWidth||600)-16,v=pg.getViewport({scale:w/pg.getViewport({scale:1}).width*Math.min(window.devicePixelRatio||1,1.5)}),cv=document.createElement('canvas');cv.width=v.width;cv.height=v.height;cv.style.width='100%';cv.className='mb-2 rounded-lg border border-gray-200 bg-white';c.appendChild(cv);await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise}
  }else c.innerHTML=`<iframe src="${URL.createObjectURL(new Blob([u],{type:'application/pdf'}))}" class="w-full h-[70vh] rounded-xl"></iframe>`;
 }catch(e){c.innerHTML='<p class="text-xs text-red-600">No se pudo mostrar el PDF. Probá con el botón Descargar.</p>';console.warn(e)}}
async function descargarPlan(uid){try{const u=await bytesDe('planes_nutricionales',uid,'partes'),pd=(await getDoc(doc(db,'planes_nutricionales',uid))).data()||{},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));a.download=pd.pdfNombre||'plan-alimentario.pdf';a.click()}catch(e){toast('No se pudo descargar: '+e.message,1)}}
async function subirPlan(uid){const f=$('plan-file')?.files[0];if(!f)return toast('Elegí un PDF.',1);
 if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')return toast('Solo se aceptan archivos PDF.',1);
 if(f.size>MAX_PDF)return toast('El PDF supera los 3 MB.',1);
 try{toast('Subiendo el plan...');const d=await b64(f),parts=Math.ceil(d.length/CH);
  for(const p of (await getDocs(collection(db,'planes_nutricionales',uid,'partes'))).docs)await deleteDoc(p.ref);
  for(let i=0;i<parts;i++)await setDoc(doc(db,'planes_nutricionales',uid,'partes',String(i)),{d:d.slice(i*CH,(i+1)*CH)});
  await setDoc(doc(db,'planes_nutricionales',uid),{pdfNombre:f.name.slice(0,80),pdfSize:f.size,pdfPartes:parts,pdfFecha:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});
  toast('Plan cargado. El paciente ya puede verlo.');go('paciente')}catch(e){toast('No se pudo subir: '+e.message,1)}}
async function guardarComentario(uid){try{await setDoc(doc(db,'planes_nutricionales',uid),{comentario:$('plan-com').value.trim(),comentarioFecha:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});toast('Comentario guardado. El paciente ya lo puede ver.')}catch(e){toast('Error: '+e.message,1)}}
async function borrarPlanPdf(uid){if(!confirm('¿Quitar el PDF del plan?'))return;
 try{for(const p of (await getDocs(collection(db,'planes_nutricionales',uid,'partes'))).docs)await deleteDoc(p.ref);await setDoc(doc(db,'planes_nutricionales',uid),{pdfNombre:null,pdfSize:null,pdfPartes:0},{merge:true});go('paciente')}catch(e){toast('Error: '+e.message,1)}}

/* ===== FICHAS: buscador y orden ===== */
const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ape=n=>{const p=String(n||'').trim().split(/\s+/);return p.length>1?p[p.length-1]:p[0]};
function listaFichas(){const d=S.fd||{us:[],fi:[]},q=norm($('fb-q')?.value),o=$('fb-o')?.value||'na',dir=o[1]==='z'?-1:1,key=u=>norm(o[0]==='a'?ape(u.displayName):u.displayName);
 const l=d.us.filter(u=>!q||norm(u.displayName+' '+u.email).includes(q)).sort((a,b)=>key(a).localeCompare(key(b),'es')*dir);
 return l.length?patList(l,d.fi,1):'<p class="text-xs text-gray-500">No se encontraron pacientes.</p>'}
const filtrarFichas=()=>{$('f-lista').innerHTML=listaFichas()};

/* ===== FICHA DEL PACIENTE (vista para nutricionistas) ===== */
const FLAB={nacimiento:'Fecha de nacimiento',sexo:'Sexo',telefono:'WhatsApp',peso:'Peso (kg)',altura:'Altura (cm)',objetivo:'Objetivo',patologias:'Alergias, intolerancias y patologías',grasa:'% Grasa',musculo:'% Músculo',obs:'Observaciones'};
const edad=n=>{const d=new Date(n+'T12:00:00'),h=new Date();if(isNaN(d))return '?';let a=h.getFullYear()-d.getFullYear();if(h<new Date(h.getFullYear(),d.getMonth(),d.getDate()))a--;return a};
VIEWS.paciente=async()=>{const id=S.pac,[u,f,p]=await Promise.all(['users','fichas_medicas','planes_nutricionales'].map(c=>getDoc(doc(db,c,id)).catch(()=>null)));
 if(!u||!u.exists())return `<div class="card text-center text-sm text-gray-500">No se encontró el paciente o no tenés acceso. <button class="btn mt-3" onclick="go('${S.volver||'fichas'}')">Volver</button></div>`;
 const us=u.data(),fi=(f&&f.data())||{},pd=(p&&p.data())||{},es=await listEst(id),eq=S.admin?await all('equipo'):[],falta=!completa(fi);
 const nom=us.nutriId&&us.nutriId!=='admin'?((eq.find(e=>e.id===us.nutriId)||{}).nombre||'Otra nutricionista'):'Lic. Pamela Lagardo';
 const datos=`<div class="grid sm:grid-cols-2 gap-3">${S.admin?`<div class="p-3 bg-sand rounded-2xl sm:col-span-2"><span class="block text-[0.6875rem] font-bold text-gray-500">Nutricionista a cargo</span><span class="text-sm font-semibold">${esc(nom)}</span></div>`:''}${FIELDS.map(x=>{const k=x[0],v=fi[k],vac=!String(v??'').trim();return `<div class="p-3 bg-sand rounded-2xl ${['patologias','obs','objetivo'].includes(k)?'sm:col-span-2':''}"><span class="block text-[0.6875rem] font-bold text-gray-500">${FLAB[k]}</span>${vac?(x[3]?'<span class="text-xs text-red-600 font-bold">⚠ Por favor rellene información</span>':'<span class="text-xs text-gray-400">--</span>'):`<span class="text-sm font-semibold whitespace-pre-line">${esc(v)}${k==='nacimiento'?' ('+edad(v)+' años)':''}</span>`}</div>`}).join('')}</div>`;
 const form=`<form onsubmit="guardarFicha(event,'${id}')">${FIELDS.map(x=>fld(x,fi[x[0]])).join('')}${S.admin?`<label class="lbl">Nutricionista a cargo</label><select id="f-nutriId" class="inp"><option value="admin">Lic. Pamela Lagardo</option>${eq.map(e=>`<option value="${e.id}"${us.nutriId===e.id?' selected':''}>${esc(e.nombre)}</option>`).join('')}</select>`:''}<div class="flex gap-2 mt-5"><button class="btn">Guardar cambios</button><button type="button" class="btn2" onclick="S.pacEdit=false;go('paciente')">Cancelar</button></div></form>`;
 return `<div class="space-y-6 max-w-4xl"><div class="card flex justify-between items-start gap-3"><div><button class="text-xs font-bold text-brand-700 hover:underline mb-2" onclick="go('${S.volver||'fichas'}')">← Volver</button><h2 class="text-2xl font-extrabold">${esc(us.displayName||'Paciente')}</h2><span class="text-xs text-gray-500 mr-2">${esc(us.email)}</span>${badgeEstado(us.estado)}</div><button onclick="S.pacEdit=!S.pacEdit;go('paciente')" title="${S.pacEdit?'Cancelar edición':falta?'Faltan datos: editar':'Editar datos del paciente'}" class="w-11 h-11 shrink-0 rounded-full border ${S.pacEdit?'bg-brand-700 text-white border-brand-700':'bg-white text-gray-600 border-gray-300'} ${falta&&!S.pacEdit?'ring-2 ring-amber-400 animate-pulse':''}"><i class="fa-solid fa-gear"></i></button></div>
<div class="card space-y-3"><h3 class="text-lg font-extrabold">${S.pacEdit?'Editar datos':'Datos del paciente'}</h3>${S.pacEdit?form:datos}</div>
<div class="card space-y-3"><h3 class="text-lg font-extrabold">Estudios médicos (${es.length}/5)</h3><div class="space-y-2">${estHTML(es,S.admin)}</div></div>
<div class="card space-y-3"><h3 class="text-lg font-extrabold">Plan alimentario</h3>${pd.pdfPartes>0?`<div class="flex flex-wrap justify-between items-center gap-2"><span class="text-xs font-bold"><i class="fa-solid fa-file-pdf text-red-500"></i> ${esc(pd.pdfNombre)}</span><span class="flex gap-2"><button class="btn" onclick="descargarPlan('${id}')"><i class="fa-solid fa-download"></i> Descargar</button><button class="btn2 text-red-600" onclick="borrarPlanPdf('${id}')">Quitar PDF</button></span></div><div id="visor" class="max-h-[75vh] overflow-y-auto rounded-2xl bg-sand p-2 text-xs text-gray-500">Cargando el plan...</div>`:'<p class="text-xs text-gray-500">Todavía no cargaste un PDF para este paciente.</p>'}
<div><label class="lbl">${pd.pdfPartes>0?'Reemplazar PDF del plan':'Cargar PDF del plan'} (hasta 3 MB)</label><input id="plan-file" type="file" accept="application/pdf" class="text-xs"><button class="btn mt-2" onclick="subirPlan('${id}')"><i class="fa-solid fa-upload"></i> Subir plan</button></div>
<div><label class="lbl">Comentario para el paciente</label><textarea id="plan-com" maxlength="2000" class="inp h-24" placeholder="Indicaciones, recomendaciones, próximos pasos...">${esc(pd.comentario)}</textarea><button class="btn mt-2" onclick="guardarComentario('${id}')">Guardar comentario</button></div></div></div>`};

/* ===== TIENDA: flechas y pantalla completa ===== */
function moverCard(id,d){const im=S.prods[id].imgs,n=im.length;S.ci=S.ci||{};S.ci[id]=((S.ci[id]||0)+d+n)%n;$('cv-'+id).src=im[S.ci[id]]}
function fsImg(id,i){const p=S.prods[id];if(!p||!(p.imgs||[]).length)return;S.fs={id,i};
 if(!$('fs-ov')){const o=document.createElement('div');o.id='fs-ov';o.className='fixed inset-0 z-[70] bg-black flex items-center justify-center';document.body.appendChild(o);if(o.requestFullscreen)o.requestFullscreen().catch(()=>{})}
 pintarFs()}
function pintarFs(){const {id,i}=S.fs,im=S.prods[id].imgs;$('fs-ov').innerHTML=`<img src="${esc(im[i])}" class="max-w-full max-h-full object-contain">${im.length>1?`<button onclick="fsNav(-1)" class="absolute left-3 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/20 text-white text-2xl" title="Anterior">‹</button><button onclick="fsNav(1)" class="absolute right-3 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/20 text-white text-2xl" title="Siguiente">›</button>`:''}<button onclick="cerrarFs()" class="absolute top-4 right-4 w-11 h-11 rounded-full bg-white/20 text-white text-xl" title="Cerrar">✕</button><span class="absolute bottom-4 left-1/2 -translate-x-1/2 text-white text-xs">${i+1} / ${im.length}</span>`}
function fsNav(d){const n=S.prods[S.fs.id].imgs.length;S.fs.i=(S.fs.i+d+n)%n;pintarFs()}
function cerrarFs(){const f=S.fs;S.fs=null;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});$('fs-ov')?.remove();if(f&&$('modal').innerHTML)verProd(f.id,f.i)}
document.addEventListener('keydown',e=>{if(!S.fs)return;if(e.key==='ArrowLeft')fsNav(-1);else if(e.key==='ArrowRight')fsNav(1);else if(e.key==='Escape')cerrarFs()});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&S.fs)cerrarFs()});

/* ===== TEMPORIZADOR Y ARRANQUE ===== */
setInterval(()=>{const t=$('oferta-timer');if(!t)return;
 if(!ofertaOn()){go('turnos');return}
 const s=Math.floor((ar(S.cfg.oferta.hasta)-Date.now())/1000),p=n=>String(n).padStart(2,'0');
 t.textContent=`${Math.floor(s/86400)}d ${p(Math.floor(s%86400/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`},1000);
consultorio();setInterval(consultorio,60000);
Object.assign(window,{S,auth,onUser,filtrarFichas,moverCard,fsImg,fsNav,cerrarFs,subirPlan,guardarComentario,borrarPlanPdf,descargarPlan,verPolitica,aceptarConsent,descargarCopia,regN,resetM,guardarPrecios,askLogout,cambiarTam,cambiarTema,verPw,irTurno,subirEstudios,verEstudio,borrarEstudio,addImgs,quitarImg,portadaImg,verProd,verFoto,addFotosRes,quitarFotoRes,enviarResena,setResena,setFin,guardarSitio,aprobarNutri,rechazarNutri,revocarNutri,go,modalAuth,closeModal,loginG,loginF,loginM,regM,logout,selPlan,selMod,selHora,selFecha,pagar,irMP,comprar,modalProd,guardarProd,borrarProd,seedProd,abrirFicha,guardarFicha,setAsist});
aplicarPref();loadSitio();if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
render();
</script>
