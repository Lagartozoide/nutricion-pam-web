REGLAS DE FIRESTORE (Firebase > Firestore > Reglas > Publicar). Reemplazá PEGAR_UID por el UID de la cuenta de Pamela (Authentication > Usuarios):
rules_version='2';service cloud.firestore{match /databases/{database}/documents{
 function own(u){return request.auth!=null&&request.auth.uid==u;}
 function admin(){return request.auth!=null&&request.auth.uid in ['a79ZbGcMT6hQXsfnsIxIRHKYRJK2','UID_DE_PEDRO'];}
 function nutri(){return admin()||(request.auth!=null&&exists(/databases/$(database)/documents/nutris/$(request.auth.uid)));}
 function mine(u){return nutri()&&get(/databases/$(database)/documents/users/$(u)).data.nutriId==request.auth.uid;}
 match /users/{u}{allow read:if own(u)||admin()||(nutri()&&resource.data.nutriId==request.auth.uid);allow create:if own(u)||admin();allow update:if own(u)||admin()||mine(u);allow delete:if admin();}
 match /fichas_medicas/{u}{allow read,write:if own(u)||admin()||mine(u);}
 match /planes_nutricionales/{u}{allow read:if own(u)||admin()||mine(u);allow write:if admin()||mine(u);}
 match /turnos/{t}{allow read:if admin()||resource.data.userId==request.auth.uid||(nutri()&&resource.data.nutriId==request.auth.uid);allow create:if request.auth!=null&&request.resource.data.userId==request.auth.uid;allow update,delete:if admin()||(nutri()&&resource.data.nutriId==request.auth.uid);}
 match /slots/{s}{allow read:if true;allow create:if request.auth!=null;allow update,delete:if nutri();}
 match /productos/{p}{allow read:if true;allow write:if admin();}
 match /ventas/{v}{allow read:if admin();allow create:if request.auth!=null&&request.resource.data.userId==request.auth.uid;}
 match /nutris/{u}{allow read:if admin()||own(u);allow write:if admin();}
 match /equipo/{u}{allow read:if true;allow write:if admin();}
 match /config/{c}{allow read:if true;allow write:if admin();}
 match /solicitudes/{u}{allow read:if admin()||own(u);allow create:if own(u)&&request.resource.data.estado=='pendiente';allow update,delete:if admin();}
}}

async function onUser(u){
 S.user=u;S.nutri=false;S.admin=false;S.pend=null;S.estado='nuevo';S.nutriId='admin';S.info={};
 if(u){
  const em=(u.email||'').toLowerCase();closeModal();
  if(NUTRI_EMAILS.includes(em)){
   if(!u.providerData.some(p=>p.providerId==='password')){await signOut(auth);return toast('La cuenta de la administradora solo ingresa con email y contraseña.',1)}
   S.nutri=S.admin=true;S.info={nombre:'Lic. Pamela Lagardo',matricula:'MP-710'};
  }else{
   try{const nd=await getDoc(doc(db,'nutris',u.uid));
    if(nd.exists()&&nd.data().activo!==false){S.nutri=true;S.info=nd.data()}
    else{const sd=await getDoc(doc(db,'solicitudes',u.uid));
     if(sd.exists())S.pend=sd.data().estado||'pendiente';
     else{const r=doc(db,'users',u.uid),x=await getDoc(r);
      if(!x.exists())await setDoc(r,{displayName:u.displayName||em.split('@')[0],email:em,role:'paciente',estado:'nuevo',nutriId:'admin',createdAt:serverTimestamp()});
      const d=x.data()||{};S.estado=d.estado||'nuevo';S.nutriId=d.nutriId||'admin'}}
   }catch(e){console.warn(e)}
   if(!S.nutri&&!S.pend&&S.estado==='nuevo'){S.tab='ficha';toast('Completá tus datos para pasar a "Paciente activo".')}
  }
  if(S.nutri&&['turnos','plan','ficha'].includes(S.tab))S.tab='nutri';
 }else if(['nutri','fichas','agenda','equipo'].includes(S.tab))S.tab='dashboard';
 render();
}

}

function fld(x,v,nw){const [k,l,t,r]=x,warn=!nw&&r&&!String(v??'').trim()?' <span class="text-red-600 normal-case">⚠ Por favor rellene información</span>':'';

 return `<label class="lbl">${l}${warn}</label>${inp}`}
function patList(pac,fi,detalle){if(!pac.length)return '<p class="text-xs text-gray-500">Todavía no hay pacientes registrados.</p>';
 return `<div class="${detalle?'grid md:grid-cols-2 gap-3':'space-y-3'}">${pac.map(p=>{const f=fi.find(x=>x.id===p.id)||{};return `<div onclick="abrirFicha('${p.id}')" class="border border-gray-200 rounded-2xl p-4 bg-sand cursor-pointer hover:border-brand-600 flex justify-between items-start gap-2"><div><h4 class="font-bold text-sm">${esc(p.displayName||'Paciente sin nombre')}</h4><span class="text-xs text-gray-500">${esc(p.email)}${f.telefono?' • Tel: '+esc(f.telefono):''}</span>${f.patologias?`<p class="text-[11px] text-red-600 font-semibold mt-0.5"><i class="fa-solid fa-notes-medical"></i> ${esc(f.patologias)}</p>`:''}${detalle?`<p class="text-[11px] text-gray-600 mt-1">${f.peso?esc(f.peso)+' kg':'-- kg'} • ${f.altura?esc(f.altura)+' cm':'-- cm'} • Grasa ${f.grasa?esc(f.grasa)+'%':'--'}</p>`:''}${completa(f)?'':'<p class="text-[11px] text-amber-700 font-bold mt-0.5">Por favor rellene información</p>'}</div>${badgeEstado(p.estado)}</div>`}).join('')}</div>`}
async function abrirFicha(id){
 const [u,f,p]=await Promise.all(['users','fichas_medicas','planes_nutricionales'].map(c=>getDoc(doc(db,c,id)).catch(()=>null)));const eq=S.admin?await all('equipo'):[];
 const us=u?.data()||{},fi=f?.data()||{};
 modal(`<div class="mb-2 pr-6"><h3 class="text-xl font-extrabold">${esc(us.displayName||'Paciente')}</h3><span class="text-xs text-gray-500">${esc(us.email)}</span> ${badgeEstado(us.estado)}</div><p class="text-[11px] text-gray-500">Si el paciente no completó sus datos, podés rellenarlos vos.</p><form onsubmit="guardarFicha(event,'${id}')">${FIELDS.map(x=>fld(x,fi[x[0]])).join('')}${S.admin?`<label class="lbl">Nutricionista a cargo</label><select id="f-nutriId" class="inp"><option value="admin">Lic. Pamela Lagardo</option>${eq.map(e=>`<option value="${e.id}"${us.nutriId===e.id?' selected':''}>${esc(e.nombre)}</option>`).join('')}</select>`:''}<label class="lbl">Plan alimentario</label><textarea id="f-plan" class="inp h-28" placeholder="Detalles del plan, semanas, menúes...">${esc(p?.data()?.plan)}</textarea><button class="btn mt-5 w-full">Guardar</button></form>`)}
async function guardarFicha(e,id){e.preventDefault();
 try{const ref=doc(db,'fichas_medicas',id),cur=(await getDoc(ref)).data()||{},v={};
  FIELDS.forEach(x=>{const el=$('f-'+x[0]);if(el)v[x[0]]=el.value.trim()});
  const nf={...cur,...v};await setDoc(ref,{...v,updatedAt:serverTimestamp()},{merge:true});
  const estado=completa(nf)?'activo':'nuevo';
  await setDoc(doc(db,'users',id),{estado,telefono:nf.telefono||'',...($('f-nutriId')?{nutriId:$('f-nutriId').value}:{})},{merge:true});
  if($('f-plan')?.value.trim())await setDoc(doc(db,'planes_nutricionales',id),{plan:$('f-plan').value,updatedAt:serverTimestamp()},{merge:true});
  if(!S.nutri){S.estado=estado}
  closeModal();toast(estado==='activo'?'¡Datos guardados! Ya sos paciente activo.':'Datos guardados. Faltan campos para pasar a paciente activo.');render();
 }catch(err){toast('No se pudo guardar: '+err.message,1)}}

function cartHTML(){const p=PLANES[S.plan];return `<div class="space-y-4"><div class="flex items-center space-x-2 pb-3 border-b border-gray-200"><i class="fa-solid fa-cart-shopping text-brand-700"></i><h3 class="font-black">Resumen de compra</h3></div><div class="text-xs space-y-2"><span class="text-gray-400 block font-bold text-[10px]">Plan seleccionado</span><b class="block leading-tight">${p.n}</b><span class="text-brand-700 font-semibold block">${S.mod} • ${p.dur}</span><div class="pt-2 border-t border-gray-200"><span class="text-gray-400 block font-bold text-[10px]">Cita</span><b>📅 ${S.fecha} a las ${S.hora||'(elegí un horario)'}</b></div></div>
<div class="pt-3 border-t border-gray-200 space-y-1 text-xs"><div class="flex justify-between text-gray-600"><span>Precio de lista:</span><span class="${ofertaOn()?'line-through':''}">${money(p.reg)}</span></div>${ofertaOn()?`<div class="flex justify-between text-emerald-700 font-bold"><span>Descuento promocional:</span><span>-${money(p.reg-p.of)}</span></div>`:''}<div class="flex justify-between text-base font-black pt-2 border-t border-gray-200"><span>Total:</span><span class="text-brand-800">${money(precio(p))} ARS</span></div></div>
<button onclick="pagar()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-extrabold py-4 rounded-2xl text-xs shadow"><i class="fa-solid fa-shield-halved"></i> Comprar con Mercado Pago</button></div>`}
const selPlan=i=>{S.plan=i;go('turnos')},selMod=m=>{S.mod=m;go('turnos')};
function selHora(h){S.hora=h;cargarHoras();$('cart').innerHTML=cartHTML()}
function selFecha(v){S.fecha=v;S.hora=null;cargarHoras();$('cart').innerHTML=cartHTML()}
async function cargarHoras(){const c=$('horas');if(!c)return;const d=new Date(S.fecha+'T12:00:00').getDay();
 if(d===0||d===6){c.innerHTML='<p class="col-span-full text-xs text-gray-500">El consultorio atiende de lunes a viernes. Elegí otra fecha.</p>';return}
 c.innerHTML='<p class="col-span-full text-xs font-bold text-brand-800 animate-pulse">Revisando disponibilidad en tiempo real...</p>';
 let occ=[];try{occ=(await getDocs(query(collection(db,'slots'),where('nutriId','==',S.nutriId),where('fecha','==',S.fecha)))).docs.map(x=>x.data().hora)}catch(e){console.warn(e)}
 c.innerHTML=HORAS.map(h=>occ.includes(h)?`<button disabled class="p-3 border border-red-200 bg-red-50 text-red-500 rounded-xl text-xs font-bold cursor-not-allowed"><i class="fa-solid fa-xmark"></i> ${h}</button>`:`<button onclick="selHora('${h}')" class="p-3 border rounded-xl text-xs font-bold transition ${S.hora===h?'bg-brand-700 text-white border-brand-700':'border-gray-300 hover:bg-brand-50'}">${h}</button>`).join('')}
async function pagar(){
 if(!S.user){toast('Iniciá sesión con tu cuenta de paciente para reservar.',1);return modalAuth()}
 if(!S.hora)return toast('Elegí un horario disponible.',1);
 const p=PLANES[S.plan],sid=doc(db,'slots',slotId(S.nutriId,S.fecha,S.hora));
 try{if((await getDoc(sid)).exists()){cargarHoras();return toast('Ese horario se acaba de ocupar. Elegí otro.',1)}
  await setDoc(sid,{nutriId:S.nutriId,fecha:S.fecha,hora:S.hora});
  await addDoc(collection(db,'turnos'),{userId:S.user.uid,paciente:nombre(),email:S.user.email,plan:p.n,planKey:p.k,modalidad:S.mod,fecha:S.fecha,hora:S.hora,monto:precio(p),nutriId:S.nutriId,asistencia:'pendiente',createdAt:serverTimestamp()});
 }catch(e){return toast('No se pudo reservar: '+e.message,1)}
 modal(`<div class="text-center space-y-3"><div class="w-14 h-14 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center text-2xl mx-auto"><i class="fa-solid fa-cart-shopping"></i></div><h3 class="text-xl font-black">Turno reservado</h3><p class="text-xs text-gray-500">Revisá los detalles y abonalo en Mercado Pago.</p></div><div class="bg-sand p-4 rounded-2xl border border-gray-200 text-xs space-y-1 my-4"><b class="text-sm block">${p.n}</b><span class="text-brand-800 font-semibold">${S.mod} • ${S.fecha} a las ${S.hora}</span><div class="pt-2 mt-2 border-t border-gray-200 flex justify-between"><b>Monto total:</b><b class="text-lg text-brand-800">${money(precio(p))} ARS</b></div></div><button onclick="irMP('${p.k}')" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-extrabold py-3.5 rounded-2xl text-xs"><i class="fa-solid fa-lock"></i> Ir a pagar en Mercado Pago</button><button onclick="closeModal()" class="btn2 w-full mt-2">Pagar después</button>`)}
function irMP(k){const p=PLANES.find(x=>x.k===k),l=ofertaOn()?p.linkOf:p.linkReg;if(!l){closeModal();return toast('Tu turno quedó reservado. La nutricionista te va a contactar para coordinar el pago.')}location.href=l}

/* ===== TIENDA ===== */
function modalProd(id){const p=S.prods[id]||{};
 modal(`<h3 class="text-xl font-extrabold mb-1">${id?'Editar':'Agregar'} artículo</h3><form onsubmit="guardarProd(event,'${id||''}')"><label class="lbl">Nombre</label><input id="p-n" required class="inp" value="${esc(p.nombre)}"><label class="lbl">Descripción</label><textarea id="p-d" class="inp h-16">${esc(p.desc)}</textarea><div class="grid grid-cols-2 gap-3"><div><label class="lbl">Precio (ARS)</label><input id="p-p" type="number" min="0" required class="inp" value="${esc(p.precio)}"></div><div><label class="lbl">Emoji / ícono</label><input id="p-e" class="inp" value="${esc(p.emoji||'📚')}"></div></div><label class="lbl">Link de pago de Mercado Pago (opcional)</label><input id="p-l" type="url" class="inp" value="${esc(p.link)}"><div class="flex gap-2 mt-5"><button class="btn flex-1">Guardar</button>${id?`<button type="button" onclick="borrarProd('${id}')" class="btn2 text-red-600 border-red-300">Eliminar</button>`:''}</div></form>`)}
async function guardarProd(e,id){e.preventDefault();const d={nombre:$('p-n').value.trim(),desc:$('p-d').value.trim(),precio:Number($('p-p').value),emoji:$('p-e').value.trim(),link:$('p-l').value.trim(),updatedAt:serverTimestamp()};
 try{id?await setDoc(doc(db,'productos',id),d,{merge:true}):await addDoc(collection(db,'productos'),d);closeModal();toast('Artículo guardado.');go('tienda')}catch(err){toast('Error: '+err.message,1)}}
async function borrarProd(id){if(!confirm('¿Eliminar este artículo?'))return;try{await deleteDoc(doc(db,'productos',id));closeModal();go('tienda')}catch(e){toast('Error: '+e.message,1)}}
async function seedProd(){try{await addDoc(collection(db,'productos'),{nombre:'Recetario Digital Antiinflamatorio',desc:'Más de 40 recetas prácticas explicadas paso a paso.',precio:3500,emoji:'📚',link:''});await addDoc(collection(db,'productos'),{nombre:'Yerba Mate Orgánica YASY',desc:'Yerba mate especial seleccionada, sin polvillo, origen Misiones.',precio:4500,emoji:'🧉',link:''});go('tienda')}catch(e){toast('Error: '+e.message,1)}}
async function comprar(id){const p=S.prods[id];
 if(!S.user){toast('Iniciá sesión para comprar.',1);return modalAuth()}
 try{await addDoc(collection(db,'ventas'),{productId:id,nombre:p.nombre,precio:p.precio,userId:S.user.uid,email:S.user.email,createdAt:serverTimestamp()})}catch(e){return toast('Error: '+e.message,1)}
 if(p.link)window.open(p.link,'_blank');else toast('Compra registrada. La nutricionista te contactará para coordinar el pago y la entrega.')}

/* ===== EQUIPO DE NUTRICIONISTAS ===== */
const qq=(c,f,v)=>getDocs(query(collection(db,c),where(f,'==',v))).then(x=>x.docs.map(d=>({id:d.id,...d.data()}))).catch(e=>{console.warn(c,e);return[]});
const misUsers=()=>S.admin?all('users'):qq('users','nutriId',S.user.uid);
const misTurnos=()=>S.admin?all('turnos'):qq('turnos','nutriId',S.user.uid);
const fichasDe=us=>Promise.all(us.filter(u=>u.role==='paciente').map(u=>getDoc(doc(db,'fichas_medicas',u.id)).then(d=>({id:u.id,...(d.data()||{})})).catch(()=>({id:u.id}))));
const PEND=()=>{const p=S.pend==='pendiente';return `<div class="card text-center space-y-3 max-w-xl mx-auto"><div class="text-4xl">${p?'⏳':'🚫'}</div><h2 class="text-xl font-extrabold">${p?'Tu solicitud está pendiente de aprobación':'Tu acceso como nutricionista no está activo'}</h2><p class="text-xs text-gray-600">${p?'La administradora revisa tus datos y vas a poder ingresar al panel apenas te apruebe.':'Contactá a la administradora de la página.'}</p><div class="flex justify-center gap-2"><button class="btn" onclick="onUser(auth.currentUser)">Actualizar estado</button><button class="btn2" onclick="logout()">Cerrar sesión</button></div></div>`};
VIEWS.equipo=async()=>{const [sol,nu,us]=await Promise.all([all('solicitudes'),all('nutris'),all('users')]),pend=sol.filter(x=>x.estado==='pendiente');
 return `<div class="space-y-6"><h2 class="text-2xl font-extrabold text-purple-900">Equipo de nutricionistas</h2>
<div class="card space-y-3"><h3 class="text-lg font-extrabold">Solicitudes pendientes</h3>${pend.length?pend.map(x=>`<div class="p-4 bg-sand border border-gray-200 rounded-2xl flex flex-wrap justify-between items-center gap-2"><div><b class="text-sm">${esc(x.nombre)} ${esc(x.apellido)}</b><span class="block text-xs text-gray-500">${esc(x.email)} • Matrícula ${esc(x.matricula)}</span></div><div class="flex gap-2"><button class="chip bg-emerald-600 text-white" onclick="aprobarNutri('${x.id}')">Aprobar</button><button class="chip bg-red-600 text-white" onclick="rechazarNutri('${x.id}')">Rechazar</button></div></div>`).join(''):'<p class="text-xs text-gray-500">No hay solicitudes pendientes.</p>'}</div>
<div class="card space-y-3"><h3 class="text-lg font-extrabold">Nutricionistas activas</h3>${nu.length?nu.map(n=>`<div class="p-4 bg-sand border border-gray-200 rounded-2xl flex flex-wrap justify-between items-center gap-2"><div><b class="text-sm">${esc(n.nombre)}</b><span class="block text-xs text-gray-500">${esc(n.email)} • Matrícula ${esc(n.matricula)} • ${us.filter(u=>u.nutriId===n.id).length} pacientes</span></div><button class="chip bg-red-600 text-white" onclick="revocarNutri('${n.id}')">Quitar acceso</button></div>`).join(''):'<p class="text-xs text-gray-500">Todavía no sumaste nutricionistas.</p>'}</div></div>`};
async function aprobarNutri(id){try{const x=(await getDoc(doc(db,'solicitudes',id))).data(),nom='Lic. '+x.nombre+' '+x.apellido;
 await setDoc(doc(db,'nutris',id),{nombre:nom,email:x.email,matricula:x.matricula,activo:true,createdAt:serverTimestamp()});
 await setDoc(doc(db,'equipo',id),{nombre:nom});
 await setDoc(doc(db,'solicitudes',id),{estado:'aprobada'},{merge:true});toast('Nutricionista aprobada.');go('equipo')}catch(e){toast('Error: '+e.message,1)}}
async function rechazarNutri(id){try{await setDoc(doc(db,'solicitudes',id),{estado:'rechazada'},{merge:true});go('equipo')}catch(e){toast('Error: '+e.message,1)}}
async function revocarNutri(id){if(!confirm('¿Quitar el acceso? Sus pacientes pasan a tu cuenta.'))return;
 try{for(const p of await qq('users','nutriId',id))await setDoc(doc(db,'users',p.id),{nutriId:'admin'},{merge:true});
 await deleteDoc(doc(db,'nutris',id));await deleteDoc(doc(db,'equipo',id));await setDoc(doc(db,'solicitudes',id),{estado:'revocada'},{merge:true});go('equipo')}catch(e){toast('Error: '+e.message,1)}}

/* ===== PRECIOS Y OFERTAS (solo administradora) ===== */
S.cfg={};
async function loadCfg(){try{const d=await getDoc(doc(db,'config','precios'));S.cfg=d.exists()?d.data():{}}catch(e){console.warn(e)}
 PLANES.forEach(p=>{const c=(S.cfg.planes||{})[p.k];if(c){if(+c.reg>0)p.reg=+c.reg;if(+c.of>0)p.of=+c.of;p.linkReg=c.linkReg||'';p.linkOf=c.linkOf||''}})}
VIEWS.precios=async()=>{const o=S.cfg.oferta||{},est=!o.activa?'Desactivada':(!o.desde||!o.hasta)?'Sin fechas':Date.now()<ar(o.desde)?'Programada':Date.now()<ar(o.hasta)?'Vigente ahora':'Finalizada';
 return `<div class="space-y-6 max-w-3xl"><h2 class="text-2xl font-extrabold text-purple-900">Precios y ofertas</h2>
<div class="card space-y-4"><h3 class="text-lg font-extrabold">Precios de los planes y links de pago</h3><p class="text-[11px] text-gray-500">Mercado Pago cobra el monto del link, no el de la página: si cambiás un precio, creá un link nuevo con ese monto y pegalo acá.</p>${PLANES.map(p=>`<div class="p-4 bg-sand border border-gray-200 rounded-2xl"><b class="text-sm">${p.n}</b><div class="grid grid-cols-2 gap-3"><div><label class="lbl">Precio regular (ARS)</label><input id="pr-${p.k}-reg" type="number" min="0" class="inp" value="${p.reg}"></div><div><label class="lbl">Precio en oferta (ARS)</label><input id="pr-${p.k}-of" type="number" min="0" class="inp" value="${p.of}"></div></div><label class="lbl">Link de pago de Mercado Pago (precio regular)</label><input id="pr-${p.k}-lr" type="url" placeholder="https://mpago.la/..." class="inp" value="${esc(p.linkReg)}"><label class="lbl">Link de pago de Mercado Pago (precio en oferta)</label><input id="pr-${p.k}-lo" type="url" placeholder="https://mpago.la/..." class="inp" value="${esc(p.linkOf)}"></div>`).join('')}</div>
<div class="card space-y-3"><div class="flex flex-wrap justify-between items-center gap-2"><h3 class="text-lg font-extrabold">Oferta programada</h3><span class="chip bg-gray-100 text-gray-700">Estado: ${est}</span></div>
<label class="flex items-center gap-2 text-xs font-bold"><input id="of-on" type="checkbox" ${o.activa?'checked':''}> Activar la oferta</label>
<div class="grid sm:grid-cols-2 gap-3"><div><label class="lbl">Comienza (fecha y hora)</label><input id="of-desde" type="datetime-local" class="inp" value="${esc(o.desde)}"></div><div><label class="lbl">Termina (fecha y hora)</label><input id="of-hasta" type="datetime-local" class="inp" value="${esc(o.hasta)}"></div></div>
<p class="text-[11px] text-gray-500">Horario de Argentina. Fuera de ese rango se muestra el precio regular y el cartel de oferta desaparece.</p></div>
<button class="btn" onclick="guardarPrecios()">Guardar cambios</button></div>`};
async function guardarPrecios(){const planes={};
 for(const p of PLANES){const reg=+$(`pr-${p.k}-reg`).value,of=+$(`pr-${p.k}-of`).value;
  if(!(reg>0&&of>0&&of<reg))return toast(`En "${p.n}", el precio de oferta tiene que ser menor al regular.`,1);const lr=$(`pr-${p.k}-lr`).value.trim(),lo=$(`pr-${p.k}-lo`).value.trim();
  if((lr&&!lr.startsWith('https://'))||(lo&&!lo.startsWith('https://')))return toast('Los links de pago tienen que empezar con https://',1);
  planes[p.k]={reg,of,linkReg:lr,linkOf:lo}}
 const activa=$('of-on').checked,desde=$('of-desde').value,hasta=$('of-hasta').value;
 if(activa&&(!desde||!hasta||ar(hasta)<=ar(desde)))return toast('Completá el comienzo y el fin de la oferta (el fin tiene que ser posterior).',1);
 try{await setDoc(doc(db,'config','precios'),{planes,oferta:{activa,desde,hasta},updatedAt:serverTimestamp()});await loadCfg();toast('Precios y oferta guardados.');go('precios')}catch(e){toast('Error: '+e.message,1)}}

/* ===== TEMPORIZADOR Y ARRANQUE ===== */
setInterval(()=>{const t=$('oferta-timer');if(!t)return;
 if(!ofertaOn()){go('turnos');return}
 const s=Math.floor((ar(S.cfg.oferta.hasta)-Date.now())/1000),p=n=>String(n).padStart(2,'0');
 t.textContent=`${Math.floor(s/86400)}d ${p(Math.floor(s%86400/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`},1000);
consultorio();setInterval(consultorio,60000);
Object.assign(window,{S,auth,onUser,regN,resetM,guardarPrecios,aprobarNutri,rechazarNutri,revocarNutri,go,modalAuth,closeModal,loginG,loginF,loginM,regM,logout,selPlan,selMod,selHora,selFecha,pagar,irMP,comprar,modalProd,guardarProd,borrarProd,seedProd,abrirFicha,guardarFicha,setAsist});
render();
</script>
</body>
</html>
