<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrición Pam - Dra. Pamela Lagardo & Tienda Saludable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f2f7f2',
                            100: '#e1efe1',
                            200: '#c5dfc6',
                            600: '#388e3c',
                            700: '#2e7d32',
                            800: '#1b5e20',
                            900: '#0d3b11',
                        },
                        sand: '#faf9f5'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK Modular JS Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración oficial de Firebase obtenida de tu proyecto
        const defaultFirebaseConfig = {
            apiKey: "AIzaSyB4c9pQf8MQMR5A8qe1SKsns5S8euESNiY",
            authDomain: "kiwipam-22548.firebaseapp.com",
            projectId: "kiwipam-22548",
            storageBucket: "kiwipam-22548.firebasestorage.app",
            messagingSenderId: "984674217063",
            appId: "1:984674217063:web:48f05154ef4b19afdb38c2",
            measurementId: "G-6M4HCKS665"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        let analytics = null;
        try {
            analytics = getAnalytics(app);
        } catch (e) {
            console.log("Analytics omitido:", e);
        }

        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;

        // Login con Google Popup
        window.loginWithGoogle = async function() {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                handleSuccessfulAuth(user.displayName || 'Paciente', user.email);
            } catch (error) {
                console.error("Error en Google Auth:", error);
                alert("Ocurrió un problema al iniciar sesión con Google: " + error.message);
            }
        };

        // Registro con Email / Password
        window.registerWithEmail = async function(email, password, name) {
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                handleSuccessfulAuth(name || 'Paciente', email);
            } catch (error) {
                console.error("Error al registrar usuario:", error);
                alert("Error al crear cuenta: " + error.message);
            }
        };

        // Login con Email / Password
        window.loginWithEmail = async function(email, password) {
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                handleSuccessfulAuth(user.displayName || email.split('@')[0], email);
            } catch (error) {
                console.error("Error al iniciar sesión:", error);
                alert("Credenciales incorrectas: " + error.message);
            }
        };

        // Observador de estado de autenticación
        onAuthStateChanged(auth, (user) => {
            if (user) {
                handleSuccessfulAuth(user.displayName || user.email.split('@')[0], user.email);
            }
        });

        function handleSuccessfulAuth(name, email) {
            document.getElementById('login-gate').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            document.getElementById('welcome-user-name').innerText = name.split(' ')[0];
            document.getElementById('user-display-name').innerText = name;
            
            const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            document.getElementById('user-avatar-initials').innerText = initials || 'NC';
        }

        window.logoutUser = async function() {
            await signOut(auth);
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('login-gate').classList.remove('hidden');
        };
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #faf9f5;
            color: #1a251b;
        }
        html {
            font-size: 16px;
            transition: font-size 0.15s ease;
            scroll-behavior: smooth;
        }
        *:focus-visible {
            outline: 3px solid #2e7d32 !important;
            outline-offset: 2px !important;
        }
        body.high-contrast {
            background-color: #ffffff !important;
            color: #000000 !important;
        }
        body.high-contrast .bg-brand-700,
        body.high-contrast .bg-brand-800,
        body.high-contrast .bg-brand-900 {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        .tab-content.active {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-brand-100 selection:text-brand-800">

    <!-- Barra Superior -->
    <div class="bg-brand-900 text-white py-2 px-4 border-b border-brand-800 text-sm sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-semibold text-xs sm:text-sm">Consultorio Abierto • Posadas, Misiones y Modalidad Online</span>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-1 bg-brand-800 rounded-lg px-2 py-1">
                    <button onclick="adjustFont(-1)" class="px-2 py-0.5 rounded font-bold hover:bg-brand-700 transition text-sm">A-</button>
                    <button onclick="resetFont()" class="px-2 py-0.5 rounded text-xs hover:bg-brand-700 transition">100%</button>
                    <button onclick="adjustFont(1)" class="px-2 py-0.5 rounded font-bold hover:bg-brand-700 transition text-base">A+</button>
                </div>
                <button onclick="toggleHighContrast()" class="flex items-center space-x-1 bg-brand-800 hover:bg-brand-700 px-3 py-1 rounded-lg text-xs font-semibold transition">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                    <span class="hidden sm:inline">Alto Contraste</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Navegación Principal -->
    <header id="app-header" class="hidden bg-white border-b border-gray-200 sticky top-[37px] z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchMainTab('dashboard')">
                    <div class="w-12 h-12 rounded-2xl bg-brand-100 flex items-center justify-center text-brand-800 font-black text-2xl shadow-inner">
                        🌱
                    </div>
                    <div>
                        <span class="text-xl sm:text-2xl font-extrabold text-gray-900 tracking-tight block leading-tight">Nutrición Pam</span>
                        <span class="text-xs sm:text-sm text-brand-700 font-semibold block">Dra. Pamela Lagardo</span>
                    </div>
                </div>

                <nav class="hidden lg:flex items-center space-x-1 bg-gray-100/80 p-1.5 rounded-2xl border border-gray-200" id="desktop-nav">
                    <button onclick="switchMainTab('dashboard')" data-tab="dashboard" class="nav-btn active px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center space-x-1.5 bg-white text-brand-800 shadow-sm">
                        <i class="fa-solid fa-house"></i>
                        <span>Mi Panel</span>
                    </button>
                    <button onclick="switchMainTab('turnos')" data-tab="turnos" class="nav-btn px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center space-x-1.5 text-gray-600 hover:text-brand-800 hover:bg-white/60">
                        <i class="fa-solid fa-calendar-plus"></i>
                        <span>Agendar Turno</span>
                    </button>
                    <button onclick="switchMainTab('tienda')" data-tab="tienda" class="nav-btn px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center space-x-1.5 text-gray-600 hover:text-brand-800 hover:bg-white/60 relative">
                        <i class="fa-solid fa-store"></i>
                        <span>Tienda Saludable</span>
                    </button>
                    <button onclick="switchMainTab('plan')" data-tab="plan" class="nav-btn px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center space-x-1.5 text-gray-600 hover:text-brand-800 hover:bg-white/60">
                        <i class="fa-solid fa-utensils"></i>
                        <span>Mi Plan</span>
                    </button>
                    <button onclick="switchMainTab('ficha')" data-tab="ficha" class="nav-btn px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center space-x-1.5 text-gray-600 hover:text-brand-800 hover:bg-white/60">
                        <i class="fa-solid fa-clipboard-user"></i>
                        <span>Ficha Médica</span>
                    </button>
                </nav>

                <div class="flex items-center space-x-3">
                    <div class="hidden sm:flex items-center space-x-3 bg-brand-50 border border-brand-100 p-1.5 pr-4 rounded-full">
                        <div class="w-9 h-9 rounded-full bg-brand-700 text-white flex items-center justify-center font-bold text-sm shadow">
                            <span id="user-avatar-initials">NC</span>
                        </div>
                        <div class="text-left">
                            <span id="user-display-name" class="block text-xs font-extrabold text-gray-900 leading-none">Nahuel Cañete</span>
                            <span class="text-[11px] text-brand-700 font-semibold">Paciente Activo</span>
                        </div>
                    </div>
                    <button onclick="logoutUser()" class="p-2.5 rounded-xl text-gray-500 hover:text-red-600 hover:bg-red-50 transition" title="Cerrar sesión">
                        <i class="fa-solid fa-right-from-bracket text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- PANTALLA DE ACCESO -->
        <section id="login-gate" class="min-h-[75vh] flex items-center justify-center py-6">
            <div class="bg-white border border-gray-200 rounded-3xl shadow-xl p-8 sm:p-12 max-w-md w-full space-y-6 relative overflow-hidden">
                
                <div class="text-center space-y-2">
                    <div class="w-20 h-20 bg-brand-100 text-brand-800 rounded-3xl flex items-center justify-center text-4xl mx-auto shadow-inner">
                        🌱
                    </div>
                    <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Bienvenido/a</h1>
                    <p class="text-sm font-semibold text-brand-700">Dra. Pamela Lagardo • Nutrición Integral</p>
                </div>

                <!-- Botón Google Auth -->
                <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-gray-50 text-gray-700 font-bold py-3.5 px-4 border-2 border-gray-300 rounded-2xl flex items-center justify-center space-x-3 transition shadow-sm hover:border-gray-400">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span class="text-sm">Continuar con Google</span>
                </button>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-xs font-bold text-gray-400 uppercase tracking-wider">o correo electrónico</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <!-- Pestañas de Modo de Acceso -->
                <div class="flex border-b border-gray-200">
                    <button id="tab-login-btn" onclick="toggleAuthTab('login')" class="w-1/2 py-2 text-sm font-bold border-b-2 border-brand-700 text-brand-800">Iniciar Sesión</button>
                    <button id="tab-register-btn" onclick="toggleAuthTab('register')" class="w-1/2 py-2 text-sm font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-600">Registrarse</button>
                </div>

                <!-- Formulario -->
                <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                    <div id="name-field-container" class="hidden">
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Nombre Completo</label>
                        <input type="text" id="auth-name" placeholder="Tu Nombre y Apellido" class="w-full p-3 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-brand-700 bg-sand">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Correo Electrónico</label>
                        <input type="email" id="auth-email" required placeholder="tuemail@ejemplo.com" class="w-full p-3 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-brand-700 bg-sand">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Contraseña</label>
                        <input type="password" id="auth-password" required placeholder="••••••••" class="w-full p-3 rounded-xl border border-gray-300 text-sm focus:ring-2 focus:ring-brand-700 bg-sand">
                    </div>

                    <button type="submit" id="auth-submit-btn" class="w-full bg-brand-700 hover:bg-brand-800 text-white font-extrabold py-3 px-4 rounded-2xl transition text-base shadow-md">
                        Ingresar a mi Portal <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </form>
            </div>
        </section>

        <!-- PANEL APP -->
        <div id="app-container" class="hidden">
            <section id="tab-dashboard" class="tab-content active space-y-8">
                <div class="bg-gradient-to-r from-brand-800 to-brand-900 rounded-3xl p-6 sm:p-8 text-white shadow-lg">
                    <h1 class="text-3xl sm:text-4xl font-extrabold">¡Hola, <span id="welcome-user-name">Nahuel</span>!</h1>
                    <p class="mt-2 text-brand-100">Gestioná tus consultas, turnos y plan de alimentación.</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        let isRegisterMode = false;

        function toggleAuthTab(mode) {
            isRegisterMode = mode === 'register';
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');
            const nameContainer = document.getElementById('name-field-container');
            const submitBtn = document.getElementById('auth-submit-btn');

            if (isRegisterMode) {
                regBtn.className = "w-1/2 py-2 text-sm font-bold border-b-2 border-brand-700 text-brand-800";
                loginBtn.className = "w-1/2 py-2 text-sm font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-600";
                nameContainer.classList.remove('hidden');
                submitBtn.innerHTML = 'Crear Cuenta <i class="fa-solid fa-user-plus ml-2"></i>';
            } else {
                loginBtn.className = "w-1/2 py-2 text-sm font-bold border-b-2 border-brand-700 text-brand-800";
                regBtn.className = "w-1/2 py-2 text-sm font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-600";
                nameContainer.classList.add('hidden');
                submitBtn.innerHTML = 'Ingresar a mi Portal <i class="fa-solid fa-arrow-right ml-2"></i>';
            }
        }

        function handleAuthSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const name = document.getElementById('auth-name').value;

            if (isRegisterMode) {
                window.registerWithEmail(email, password, name);
            } else {
                window.loginWithEmail(email, password);
            }
        }

        function switchMainTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            const target = document.getElementById('tab-' + tabName);
            if (target) target.classList.add('active');
        }

        function adjustFont(delta) {
            const html = document.documentElement;
            const currentSize = parseFloat(window.getComputedStyle(html).fontSize);
            html.style.fontSize = (currentSize + delta) + 'px';
        }

        function resetFont() {
            document.documentElement.style.fontSize = '16px';
        }

        function toggleHighContrast() {
            document.body.classList.toggle('high-contrast');
        }
    </script>
</body>
</html>
